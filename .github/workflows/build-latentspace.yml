name: Build Latent Space

# The map is rebuilt locally (build-latentspace skill), because the embedding
# model runs on the author's machine. CI only runs the build script's tests,
# which stub the model, so they need no torch, no download and no secret.
on:
  push:
    branches: [main]
    paths:
      - '.agents/shared/skills/build-latentspace/scripts/**'
      - '.agents/shared/skills/add-related/scripts/**'
      - '.github/workflows/build-latentspace.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml numpy scikit-learn pytest

      - name: Run tests
        run: python3 -m pytest .agents/shared/skills/build-latentspace/scripts/test_build_post_map.py -v
